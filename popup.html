<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --text: #334155;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    body {
      width: 380px;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      text-autospace: normal;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 1.2rem;
      color: #1e293b;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 8px;
    }

    /* 模型設定區塊 */
    .model-settings {
      background: #fff;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 16px;
      
      .row {
        margin-bottom: 10px;
        &:last-child { margin-bottom: 0; }
      }

      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 4px;
      }

      select {
        width: 100%;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 0.85rem;
        background-color: #f8fafc;
        &:focus { outline: 2px solid var(--primary); border-color: transparent; }
      }
    }

    .input-group {
      margin-bottom: 16px;
      
      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;

        label {
          font-size: 0.9rem;
          font-weight: 600;
          color: #475569;
          margin: 0;
        }

        button.sm-btn {
          font-size: 0.75rem;
          padding: 4px 8px;
          background: #e2e8f0;
          color: #475569;
          border: 1px solid #cbd5e1;
          border-radius: 4px;
          cursor: pointer;
          transition: all 0.2s;
          &:hover { background: #cbd5e1; color: #1e293b; }
        }
      }
      
      textarea {
        width: 100%;
        height: 100px; /* 稍微縮小以容納模型選單 */
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.85rem;
        resize: vertical;
        box-sizing: border-box;
        margin-bottom: 8px;
        &:focus { outline: 2px solid var(--primary); border-color: transparent; }
      }

      .file-upload {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: #64748b;
        
        input[type="file"] {
          font-size: 0.8rem;
          max-width: 200px;
        }
      }
    }

    .api-section {
      background: #fff;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 16px;
      
      input {
        width: 100%;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        box-sizing: border-box;
      }
    }

    button.primary-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s;
      &:hover { filter: brightness(1.1); }
      &:disabled { background: #cbd5e1; cursor: not-allowed; }
    }

    /* 危險區域 (清除資料) */
    .danger-zone {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #cbd5e1;
      text-align: center;

      button.danger-btn {
        background: transparent;
        color: #94a3b8;
        border: 1px solid #cbd5e1;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
        
        &:hover {
          color: var(--danger);
          border-color: var(--danger);
          background: #fef2f2;
        }
      }
    }

    #status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      color: #ef4444;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-bottom: 16px;">
    <h2 style="margin: 0; border-bottom: none; padding-bottom: 0; font-size: 1.2rem; color: #1e293b;">⚔️ 戰略設定</h2>
    <a href="#" id="help-btn" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 600;">📖 使用說明</a>
  </div>

  <div class="api-section">
    <input type="password" id="api-key" placeholder="貼上你的 Google Gemini API Key">
  </div>

  <!-- 模型選擇區 -->
  <div class="model-settings">
    <div class="row">
      <label>🧠 戰略分析模型 (Text)</label>
      <select id="model-text">
        <option value="gemini-3.5-flash" selected>Gemini 3.5 Flash (標準/預設)</option>
        <option value="gemini-3.1-pro">Gemini 3.1 Pro (深度分析)</option>
      </select>
    </div>
  </div>

  <div class="input-group">
    <div class="label-row">
      <label>我方產品/服務背景資料</label>
      <button id="fetch-self-btn" class="sm-btn" title="先在瀏覽器開啟我方網頁，點此抓取內容">📑 抓取當前頁內容</button>
    </div>
    <textarea id="user-context" placeholder="請點選上方按鈕抓取我方網頁內容..." readonly></textarea>
  </div>

  <button id="start-btn" class="primary-btn">開始全頁分析 (針對競品) 🚀</button>
  
  <div id="status-msg"></div>

  <!-- 新增清除快取按鈕 -->
  <div class="danger-zone">
    <button id="clear-btn" class="danger-btn" title="刪除 API Key 與所有暫存資料">🗑️ 清除所有專案快取與 Key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
